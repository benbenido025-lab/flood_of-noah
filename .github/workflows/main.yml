name: Ubuntu VPS with Tailscale

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Ubuntu
      run: |
        echo "🚀 Starting Ubuntu VPS..."
        sudo apt-get update
        sudo apt-get install -y curl wget git vim nano htop tmux python3 python3-pip docker.io openssh-server
        
    - name: Install Tailscale
      env:
        TS_KEY: ${{ secrets.TAILSCALE_KEY }}
      run: |
        # Use your key directly (or via secret)
        TS_AUTH_KEY="tskey-auth-kiczyMxmPm11CNTRL-wWZxz1Ng2hJyqrmgHAq7iJomN6hz2je9F"
        
        # Install Tailscale
        curl -fsSL https://tailscale.com/install.sh | sh
        
        # Connect to your tailnet
        sudo tailscale up --authkey $TS_AUTH_KEY --hostname="github-vps"
        
        # Get IP
        sleep 5
        IP=$(tailscale ip -4)
        
        echo "✅ Connected to Tailscale!"
        echo "IP: $IP"
        
        # Save IP to file
        echo $IP > tailscale_ip.txt
    
    - name: Setup SSH
      run: |
        # Set password for runner user
        echo "runner:ubuntuvps123" | sudo chpasswd
        
        # Configure SSH
        sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sudo systemctl restart ssh
        
    - name: Display Connection Info
      run: |
        IP=$(cat tailscale_ip.txt)
        
        echo "══════════════════════════════════════════"
        echo "✅ VPS READY! Connect with:"
        echo "══════════════════════════════════════════"
        echo ""
        echo "🔑 SSH Command:"
        echo "  ssh runner@$IP"
        echo ""
        echo "🔐 Password: ubuntuvps123"
        echo ""
        echo "🌐 Tailscale IP: $IP"
        echo ""
        echo "💻 From your machine (must be on Tailscale):"
        echo "  ssh runner@$IP"
        echo ""
        echo "📝 To change password after connecting:"
        echo "  passwd"
        echo ""
        echo "══════════════════════════════════════════"
        
        # Save to GitHub Step Summary
        echo "## 🔑 SSH Connection Info" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
        echo "ssh runner@$IP" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
        echo "Password: \`ubuntuvps123\`" >> $GITHUB_STEP_SUMMARY
    
    - name: Keep Alive
      run: |
        echo "🔄 VPS is running. Will stay alive for 6 hours..."
        echo "Press Ctrl+C in Actions tab to stop"
        
        # Simple keep-alive
        while true; do
          echo "[$(date)] Heartbeat - VPS alive"
          sleep 300
        done
