name: Multi-Ubuntu-RDP
on:
  workflow_dispatch:
    inputs:
      instance_count:
        description: 'Number of instances (1-3)'
        required: true
        default: '3'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
      session_duration:
        description: 'Session duration (minutes)'
        required: false
        default: '360'

jobs:
  ubuntu-rdp-1:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.session_duration) }}
    
    steps:
      - name: Setup Instance 1
        run: |
          echo "================================"
          echo "    INSTANCE #1 STARTING"
          echo "================================"

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            curl wget git nano htop net-tools

      - name: Install Node.js
        run: |
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          echo "✅ Node.js $(node --version) installed"

      - name: Install Heaven Package
        run: |
          echo "🌊 Installing Heaven..."
          sudo mkdir -p /home/runner/.config/puppeteer
          sudo chown -R $(whoami):$(whoami) /home/runner
          sudo chmod -R 755 /home/runner
          cd ~
          rm -rf heaven982358265823687562395235
          git clone https://github.com/benbenido025-lab/heaven982358265823687562395235
          cd heaven982358265823687562395235
          rm -rf node_modules package-lock.json
          npm install express axios socks puppeteer --save
          echo "✅ Heaven installed"

      - name: Start Heaven Service
        run: |
          cd ~/heaven982358265823687562395235
          nohup node client.js > /tmp/heaven-1.log 2>&1 &
          sleep 5
          echo "✅ Heaven running on Instance 1"
          echo "📍 Service available at: http://localhost:3000"

      - name: Display Info
        run: |
          PUBLIC_IP=$(curl -s ifconfig.me || echo "N/A")
          echo ""
          echo "╔════════════════════════════════════════════════╗"
          echo "║         INSTANCE #1 READY                      ║"
          echo "╠════════════════════════════════════════════════╣"
          echo "║ Public IP : $PUBLIC_IP"
          echo "║ Status    : ACTIVE"
          echo "║ Heaven API : http://localhost:3000"
          echo "╚════════════════════════════════════════════════╝"

      - name: Keep Alive
        run: |
          START=$(date +%s)
          DURATION=$((${{ github.event.inputs.session_duration }} * 60))
          END=$((START + DURATION))
          echo "🟢 Instance 1 running for ${{ github.event.inputs.session_duration }} minutes"
          COUNTER=0
          while [ $(date +%s) -lt $END ]; do
            COUNTER=$((COUNTER + 1))
            ELAPSED=$((($(date +%s) - START) / 60))
            REMAIN=$(((END - $(date +%s)) / 60))
            echo "🟢 Instance 1 | ${ELAPSED}m / ${REMAIN}m remaining"
            if [ $((COUNTER % 10)) -eq 0 ]; then
              if pgrep -f "node client.js" > /dev/null; then
                echo "   ✅ Heaven service: Running"
              else
                echo "   ⚠️ Restarting Heaven service..."
                cd ~/heaven982358265823687562395235 && nohup node client.js > /tmp/heaven-1.log 2>&1 &
              fi
            fi
            sleep 60
          done

      - name: Cleanup
        if: always()
        run: |
          pkill -f "node client.js" || true
          echo "🧹 Instance 1 cleaned up"

