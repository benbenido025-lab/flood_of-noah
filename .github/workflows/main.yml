name: Ubuntu VPS with Tailscale
on:
  workflow_dispatch:
jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Ubuntu
        run: |
          echo "🚀 Starting Ubuntu VPS..."
          sudo apt-get update
          sudo apt-get install -y curl wget git vim nano htop tmux python3 python3-pip openssh-server net-tools iputils-ping neofetch

      - name: Optimize Network (Speed Boost)
        run: |
          echo "⚡ Applying network optimizations..."
          sudo sysctl -w net.core.rmem_max=134217728
          sudo sysctl -w net.core.wmem_max=134217728
          sudo sysctl -w net.ipv4.tcp_rmem="4096 87380 134217728"
          sudo sysctl -w net.ipv4.tcp_wmem="4096 65536 134217728"
          sudo sysctl -w net.core.netdev_max_backlog=250000
          sudo sysctl -w net.ipv4.tcp_window_scaling=1
          sudo sysctl -w net.ipv4.tcp_congestion_control=bbr
          sudo sysctl -w net.core.default_qdisc=fq
          sudo sysctl -w net.ipv4.tcp_fastopen=3
          echo "✅ Network optimized!"

      - name: Install Node.js & npm Packages
        run: |
          echo "📦 Installing Node.js..."
          curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash -
          sudo apt-get install -y nodejs
          echo "📦 Installing hpack and cookie-parser globally..."
          sudo npm install -g hpack cookie-parser node-fetch axios
          echo "✅ Node packages installed!"
          node -v
          npm -v

      - name: Install Python Packages
        run: |
          echo "🐍 Installing Python aiohttp..."
          pip3 install aiohttp --break-system-packages || pip3 install aiohttp
          echo "✅ Python packages installed!"
      
      - name: Install Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo tailscale up --authkey tskey-auth-kiczyMxmPm11CNTRL-wWZxz1Ng2hJyqrmgHAq7iJomN6hz2je9F --hostname="github-vps"
          sleep 5
          IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV
          echo "✅ Connected to Tailscale! IP: $IP"
      
      - name: Setup SSH
        run: |
          echo "runner:ubuntuvps123" | sudo chpasswd
          sudo sed -i 's/PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sudo systemctl restart ssh
      
      - name: Display Connection Info
        run: |
          echo "══════════════════════════════════════════"
          echo "✅ VPS READY! CONNECT VIA TAILSCALE"
          echo "══════════════════════════════════════════"
          echo ""
          echo "🔑 SSH COMMAND:"
          echo "  ssh runner@${{ env.TAILSCALE_IP }}"
          echo ""
          echo "🔐 PASSWORD: ubuntuvps123"
          echo ""
          echo "🌐 TAILSCALE IP: ${{ env.TAILSCALE_IP }}"
          echo ""
          neofetch
          echo ""
          echo "📦 INSTALLED PACKAGES:"
          echo "  • neofetch      ✅ (apt)"
          echo "  • hpack         ✅ (npm)"
          echo "  • cookie-parser ✅ (npm)"
          echo "  • node-fetch    ✅ (npm)"
          echo "  • axios         ✅ (npm)"
          echo "  • aiohttp       ✅ (pip)"
          echo ""
          echo "══════════════════════════════════════════"
      
      - name: Keep Alive
        run: |
          echo "🔄 VPS is running for 6 hours..."
          while true; do
            echo "[$(date)] Heartbeat - VPS alive on ${{ env.TAILSCALE_IP }}"
            sleep 300
          done
