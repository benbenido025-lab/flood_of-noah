name: Ubuntu VPS with Tailscale

on:
  workflow_dispatch:  # Manual trigger only

jobs:
  vps:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Ubuntu (No Docker)
      run: |
        echo "🚀 Starting Ubuntu VPS..."
        
        # Update without Docker (to avoid conflicts)
        sudo apt-get update
        sudo apt-get install -y \
          curl \
          wget \
          git \
          vim \
          nano \
          htop \
          tmux \
          python3 \
          python3-pip \
          openssh-server \
          net-tools \
          iputils-ping
        
        echo "✅ Base system ready"
    
    - name: Install Tailscale
      run: |
        # Install Tailscale
        curl -fsSL https://tailscale.com/install.sh | sh
        
        # Connect using your key
        sudo tailscale up --authkey tskey-auth-kiczyMxmPm11CNTRL-wWZxz1Ng2hJyqrmgHAq7iJomN6hz2je9F --hostname="github-vps"
        
        # Wait for connection
        sleep 5
        
        # Get IP
        IP=$(tailscale ip -4)
        echo "TAILSCALE_IP=$IP" >> $GITHUB_ENV
        
        echo "✅ Connected to Tailscale! IP: $IP"
    
    - name: Setup SSH
      run: |
        # Set password for runner user
        echo "runner:ubuntuvps123" | sudo chpasswd
        
        # Configure SSH for password auth
        sudo sed -i 's/^#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sudo sed -i 's/^PasswordAuthentication no/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sudo sed -i 's/^#PermitRootLogin prohibit-password/PermitRootLogin no/' /etc/ssh/sshd_config
        
        # Restart SSH
        sudo systemctl restart ssh
        
        echo "✅ SSH configured"
    
    - name: Create Workspace
      run: |
        # Create working directory
        mkdir -p /home/runner/workspace
        cd /home/runner/workspace
        
        # Create welcome message
        cat > welcome.txt << 'EOF'
╔════════════════════════════════════╗
║     UBUNTU VPS ON GITHUB ACTIONS   ║
║        CONNECTED VIA TAILSCALE      ║
╚════════════════════════════════════╝

Commands:
  📊 System: htop, df -h, free -h
  📁 Files: cd ~/workspace
  🔧 Tools: python3, git, vim, nano

Your Tailscale IP is shown above!
EOF
        
        echo "✅ Workspace ready at /home/runner/workspace"
    
    - name: Display Connection Info
      run: |
        echo "══════════════════════════════════════════"
        echo "✅ VPS READY! CONNECT VIA TAILSCALE"
        echo "══════════════════════════════════════════"
        echo ""
        echo "🔑 SSH COMMAND:"
        echo "  ssh runner@${{ env.TAILSCALE_IP }}"
        echo ""
        echo "🔐 PASSWORD: ubuntuvps123"
        echo ""
        echo "🌐 TAILSCALE IP: ${{ env.TAILSCALE_IP }}"
        echo ""
        echo "📝 CONNECTION STEPS:"
        echo "  1. Make sure Tailscale is running on your local machine"
        echo "  2. Run: ssh runner@${{ env.TAILSCALE_IP }}"
        echo "  3. Enter password: ubuntuvps123"
        echo "  4. Change password immediately: passwd"
        echo ""
        echo "⏰ This VPS will run for 6 hours"
        echo "══════════════════════════════════════════"
        
        # Save to GitHub Step Summary
        echo "## 🔑 SSH Connection Info" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "```bash" >> $GITHUB_STEP_SUMMARY
        echo "ssh runner@${{ env.TAILSCALE_IP }}" >> $GITHUB_STEP_SUMMARY
        echo "```" >> $GITHUB_STEP_SUMMARY
        echo "**Password:** \`ubuntuvps123\`" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Tailscale IP:** \`${{ env.TAILSCALE_IP }}\`" >> $GITHUB_STEP_SUMMARY
    
    - name: Keep Alive
      run: |
        echo "🔄 VPS is running. Will stay alive for 6 hours..."
        echo "To stop: Go to Actions tab and click 'Cancel workflow'"
        echo ""
        
        # Simple keep-alive loop
        counter=0
        while true; do
          counter=$((counter + 1))
          echo "[$(date)] Heartbeat #$counter - VPS alive on Tailscale: ${{ env.TAILSCALE_IP }}"
          sleep 300  # 5 minutes
        done
